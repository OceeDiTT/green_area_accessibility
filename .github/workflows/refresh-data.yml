name: refresh-data
# Free, serverless data refresh: runs the pipeline on a GitHub-hosted runner, publishes a small snapshot into ./published
# and commits it. Streamlit Community Cloud redeploys automatically when the repository changes.
on:
  schedule:
    - cron: "17 3 1 * *"          # 03:17 UTC on the 1st of every month
  workflow_dispatch:               # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[pipeline]"
      - name: Run the pipeline (fails if the quality checks fail; the previous data stays live)
        run: greenspace run
        env:
          PYTHONUNBUFFERED: "1"
      - name: Export the public snapshot
        run: greenspace publish
      - name: Commit the refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "data: refresh $(date -u +%Y-%m)"
            git push
          fi
      - name: Keep diagnostics when a run was rejected or crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run
          path: data/runs/**/*.failed
          if-no-files-found: ignore
          retention-days: 30
