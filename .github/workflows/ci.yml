name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[pipeline,api,dev]"
      - run: ruff check src tests
      - run: pytest -q                       # includes the geospatial and API tests
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target pipeline -t greenspace-pipeline .
      - run: docker build --target api -t greenspace-api .
      - run: docker build --target dashboard -t greenspace-dashboard .
